name: Apply UX11 preview
on:
  push:
    branches: [timeline-ux11-preview]
    paths:
      - 'timeline_ux11.js'
      - '.github/workflows/apply-ux11-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timeline-ux11-preview
      - name: Patch index to UX11
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("frame.src='/legacy-index.html?v=20260908-ux10';","frame.src='/legacy-index.html?v=20260908-ux11';")
          import re
          s=re.sub(r'<script src="/timeline_ux10\.js\?v=[^"]+"></script>', '<script src="/timeline_ux11.js?v=20260908-ux11-september"></script>', s)
          p.write_text(s)
          PY
      - name: Validate JavaScript syntax
        run: node --check timeline_ux11.js
      - name: Validate September-first timeline
        run: |
          grep -q "const START=new Date('2026-09-01T00:00:00')" timeline_ux11.js
          grep -q "const months=\[\['SETEMBRO'" timeline_ux11.js
          ! grep -q "\['AGOSTO'" timeline_ux11.js
          grep -q "ux11-detail-host" timeline_ux11.js
          grep -q "insertAdjacentElement('afterend',host)" timeline_ux11.js
          grep -q "diamond.onclick=open" timeline_ux11.js
          grep -q "board.onclick=e=>" timeline_ux11.js
      - name: Validate compact card collision algorithm
        run: |
          node <<'JS'
          const starts=[3,6,27,41,48,73]; // 04/09,07/09,28/09,12/10,19/10,13/11 from Sep 1
          const titles=['Desenvolvimento concluído','Testes Sottelli em UAT','Homologação de Revenue','Ajustes e correção de bugs','Homologação da Central de Projetos','Entrega final do desenvolvimento'];
          const total=73,gap=7;
          for(const width of [1040,1080,1200,1500]){
            const lanes=[];
            const placed=[];
            starts.forEach((day,i)=>{
              const anchor=width*(day/total),len=titles[i].length,cw=len>28?126:len>18?116:104;
              const desired=Math.max(0,Math.min(width-cw,anchor-cw/2));
              let lane=-1;
              for(let r=0;r<lanes.length;r++) if(!lanes[r].some(iv=>desired<iv.right+gap&&desired+cw>iv.left-gap)){lane=r;break}
              if(lane<0){lane=lanes.length;lanes.push([])}
              lanes[lane].push({left:desired,right:desired+cw});placed.push({lane,left:desired,right:desired+cw});
            });
            for(let i=0;i<placed.length;i++)for(let j=i+1;j<placed.length;j++)if(placed[i].lane===placed[j].lane){if(placed[i].left<placed[j].right+gap&&placed[i].right>placed[j].left-gap)throw new Error('collision '+width+' '+i+' '+j)}
            console.log('width',width,'lanes',lanes.length,'OK');
          }
          JS
      - name: Commit patched preview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preview: UX11 September-first timeline"
          git push origin HEAD:timeline-ux11-preview