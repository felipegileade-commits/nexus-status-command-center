name: Apply UX10 preview
on:
  push:
    branches:
      - timeline-ux10-preview
    paths:
      - 'patch_ux10.py'
      - '.github/workflows/apply-ux10-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index to UX10
        run: python patch_ux10.py
      - name: Validate UX10 references
        run: |
          grep -q "timeline_ux10.js?v=20260908-ux10-clickfix" index.html
          grep -q "legacy-index.html?v=20260908-ux10" index.html
      - name: Validate UX10 click implementation
        run: |
          grep -q "board.addEventListener('click'" timeline_ux10.js
          grep -q "detail.classList.add('open')" timeline_ux10.js
          grep -q "scrollIntoView" timeline_ux10.js
          grep -q "timeline-source" timeline_ux10.js
      - name: Commit patched preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Preview: load UX10 compact clickable timeline"
            git push
          fi
