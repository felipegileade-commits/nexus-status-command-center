name: Apply Timeline UX7
on:
  push:
    paths:
      - 'apply_timeline_ux7.py'
      - '.github/workflows/apply-timeline-ux7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX7 patch
        run: python apply_timeline_ux7.py
      - name: Validate layout rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert 'UX7_EXECUTIVE_TIMELINE' in s
          assert 'function buildExecutiveUX7(w)' in s
          assert "min-width:0!important;width:100%!important" in s
          assert "clone.querySelectorAll('.ux7-shell').forEach(x=>x.remove())" in s
          # Current seven executive milestones: verify generated card placement math cannot overlap.
          anchors=[2,15,18,39,53,60,85]
          titles=['Plano de Virada','Desenvolvimento concluído','Testes Sottelli em UAT','Homologação de Revenue','Ajustes e correção de bugs','Homologação da Central de Projetos','Entrega final do desenvolvimento']
          prev=0; placements=[]
          for a,t in zip(anchors,titles):
              span=11 if len(t)>42 else 10 if len(t)>28 else 9 if len(t)>18 else 8
              cs=max(1,a-max(1,span//3)); cs=max(cs,prev+1); ce=cs+span
              if ce>86:
                  cs=max(prev+1,86-span); ce=cs+span
              if ce>86: ce=86
              assert cs>prev, (t,cs,prev)
              assert 1<=cs<ce<=86, (t,cs,ce)
              placements.append((t,cs,ce)); prev=ce
          for i in range(1,len(placements)):
              assert placements[i][1] >= placements[i-1][2], placements
          print('placements:', placements)
          # Parse inline JS and validate syntax with Node in next step.
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/nexus-inline.js').write_text('\n'.join(scripts))
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/nexus-inline.js
      - name: Commit UX7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "UX: executive timeline with separate lanes and clickable milestones"
            git push
          fi
