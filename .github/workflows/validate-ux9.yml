name: Validate UX9 Timeline
on:
  push:
    branches: [timeline-ux9-preview]
    paths:
      - 'timeline_ux8.js'
      - 'timeline_ux9.js'
      - '.github/workflows/validate-ux9.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: node --check timeline_ux8.js
      - name: Validate UX requirements
        run: |
          grep -q "height:50px" timeline_ux8.js
          grep -q "<div class=\"date\">" timeline_ux8.js
          grep -q "<div class=\"title\">" timeline_ux8.js
          grep -q "ux9-detail.open" timeline_ux8.js
          grep -q "diamond.addEventListener('click',select)" timeline_ux8.js
      - name: Validate collision model
        run: |
          node <<'NODE'
          const start=new Date('2026-08-17T00:00:00Z'),end=new Date('2026-11-13T00:00:00Z');
          const items=[['2026-08-21',120],['2026-09-04',134],['2026-09-07',134],['2026-09-28',134],['2026-10-12',134],['2026-10-19',146],['2026-11-13',146]];
          for(const width of [1180,1260,1360,1500]){
            let right=-Infinity;
            for(const [date,cw] of items){
              const d=new Date(date+'T00:00:00Z');
              const p=(d-start)/(end-start);
              const anchor=width*p;
              let left=Math.max(0,Math.min(width-cw,anchor-cw/2));
              if(left<right+8) left=right+8;
              if(left+cw>width) throw new Error(`Overflow/collision at ${width}px for ${date}`);
              right=left+cw;
            }
          }
          console.log('Collision model passed at 1180/1260/1360/1500px');
          NODE
