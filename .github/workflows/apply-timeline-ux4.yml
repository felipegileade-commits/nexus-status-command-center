name: Apply Timeline UX4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-timeline-ux4.yml'
      - 'scripts/patch_timeline_ux4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply timeline patch
        run: python scripts/patch_timeline_ux4.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "UX: marcos compactos e detalhes ao clicar"
          git push
